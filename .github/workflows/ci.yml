name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep this in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.99"
  CARGO_NEAR_VERSION: "0.23.0"

jobs:
  contract:
    name: Contract (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # The contract lib must be linted for its real target. near-sdk emits a
      # compile_error for a plain host-target `cargo build`, so the wasm target
      # is not optional here.
      - name: Clippy (contract, wasm target)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      # Tests run on the host target, where the `unit-testing` feature and the
      # near-sdk mock VM are available.
      - name: Clippy (tests, host target)
        run: cargo clippy --tests -- -D warnings

      - name: Unit and boundary tests
        run: cargo test --workspace

      - name: Install cargo-near
        run: cargo install --locked cargo-near --version "$CARGO_NEAR_VERSION"

      # cargo-near must run from the contract crate, not the virtual
      # workspace root, or metadata resolution fails.
      - name: Build contract wasm
        working-directory: contracts/keyring
        run: cargo near build non-reproducible-wasm

      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyring-contract-wasm
          path: target/near/**/*.wasm
          if-no-files-found: error

  typescript:
    name: SDK and MCP server (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

  dashboard:
    name: Owner console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The console has no build step by design: it is a static page that reads
      # the contract over JSON-RPC. So CI checks that it parses and, more
      # importantly, that no invented data has crept into it.
      - name: Parse check
        run: node --check apps/dashboard/app.js

      # A console showing plausible-looking fiction is worse than no console,
      # because a reader cannot tell it apart from one that works. These are
      # the specific inventions from the original design mock-up.
      - name: Reject fabricated data
        run: |
          set +e
          PATTERN='Treasury-Optimizer|Arb-Executor|Settlement-Bot|Liquidity-Rebalancer|DevOps-Gas-Funder|Legacy-Trader|14,?290|148,?829,?104|billing\.near|yoctoNEAR|Policy Assertions'
          MATCHES=$(grep -nE "$PATTERN" apps/dashboard/index.html apps/dashboard/app.js apps/dashboard/README.md)
          if [ -n "$MATCHES" ]; then
            echo "Fabricated or placeholder data found in the console:"
            echo "$MATCHES"
            echo
            echo "Every figure must be computed from contract state."
            exit 1
          fi
          echo "No fabricated data."

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Invariant 17: no secret, key, seed phrase or funded credential may be
      # committed. A grep is a backstop, not a guarantee.
      # The pattern over-matches on purpose. A NEAR private key and a NEAR
      # public key are both 64 bytes of base58, so shape alone cannot separate
      # them; loosening the pattern to stop flagging public keys would also
      # stop it catching a leaked private one. Genuine public values are listed
      # in .secret-scan-allowlist with a reason, so every exception is explicit
      # and reviewable rather than absorbed into the regex.
      - name: Grep for committed key material
        run: |
          set +e
          PATTERN='(BEGIN [A-Z ]*PRIVATE KEY|ed25519:[1-9A-HJ-NP-Za-km-z]{80,}|"private_key"[[:space:]]*:|secp256k1:[1-9A-HJ-NP-Za-km-z]{80,})'
          MATCHES=$(grep -rInE "$PATTERN" . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target \
            --exclude=ci.yml --exclude=.secret-scan-allowlist)
          # Drop lines whose only match is an allowlisted public value.
          ALLOWED=$(grep -vE '^\s*(#|$)' .secret-scan-allowlist)
          while IFS= read -r value; do
            [ -z "$value" ] && continue
            MATCHES=$(printf '%s\n' "$MATCHES" | grep -vF "$value")
          done <<< "$ALLOWED"
          MATCHES=$(printf '%s' "$MATCHES" | grep -vE '^\s*$')
          if [ -n "$MATCHES" ]; then
            echo "Possible committed key material:"
            echo "$MATCHES"
            echo
            echo "If a value is public by construction, add it to"
            echo ".secret-scan-allowlist with a comment explaining why."
            exit 1
          fi
          echo "No unreviewed key material found."

      - name: Ensure no .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo ".env must never be committed"; exit 1
          fi
          echo "No tracked .env."
