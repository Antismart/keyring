[workspace]
resolver = "2"
members = ["contracts/keyring"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/onchainchef/keyring"
rust-version = "1.95"

[workspace.dependencies]
# Pinned to the version `cargo-near` 0.19.0 generates; resolves to 5.30.1.
near-sdk = "5.23"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Arithmetic overflow must never silently wrap in money handling code.
overflow-checks = true
